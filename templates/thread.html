<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    {{> components/sidebar.html }}

    <div class="main-content">
      <div class="thread-header">
        <div class="thread-breadcrumb">
          <a href="channel_{{channel_id}}_p1.html">#{{channel_name}}</a>
          <span class="breadcrumb-separator">›</span>
          <span class="thread-icon-header">🧵</span>
          <span class="current-thread">{{thread_name}}</span>
        </div>
        <p class="thread-info">{{thread_message_count}} messages in thread</p>
        {{pagination}}
      </div>

      <div class="messages">
        {{messages_html}}
      </div>

      <div class="channel-footer">
        {{pagination}}
      </div>
    </div>
  </div>

  {{> components/search_modal.html }}

  <script src="script.js"></script>
</body>
</html>
