<div id="searchModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="hideSearchModal()">&times;</span>
    <h2>🔍 Advanced Search</h2>

    <div class="search-form">
      <div class="form-group">
        <label for="search-text">Search Text:</label>
        <input type="text" id="search-text" placeholder="Enter search text..." autocomplete="off" />
      </div>

      <div class="form-row">
        <!-- Author: input that looks like a select + dropdown button -->
        <div class="form-group form-group-half author-autocomplete">
          <label for="search-author">Author:</label>

          <div class="select-like">
            <input
              type="text"
              id="search-author"
              placeholder="All Authors"
              autocomplete="off"
            />
            <button type="button" class="select-like-btn" id="author-dropdown-btn" aria-label="Toggle author list">
              ▼
            </button>
          </div>

          <div id="author-dropdown" class="author-dropdown" style="display:none;"></div>
        </div>

        <div class="form-group form-group-half">
          <label for="search-channel">Channel:</label>
          <select id="search-channel">
            <option value="">All Channels</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group form-group-half">
          <label for="search-date-from">From Date:</label>
          <input type="date" id="search-date-from" />
        </div>

        <div class="form-group form-group-half">
          <label for="search-date-to">To Date:</label>
          <input type="date" id="search-date-to" />
        </div>
      </div>

      <button onclick="performSearch()" class="search-btn">
        <span class="search-btn-icon"></span> Search
      </button>
    </div>

    <div id="search-results" class="search-results">
      <p class="search-placeholder">Enter search criteria and click Search.</p>
    </div>
  </div>
</div>
